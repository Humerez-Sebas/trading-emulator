<section class="section" data-zone="behavior" aria-labelledby="behavior-heading">
  <header class="section-header">
    <h2 id="behavior-heading">Behavior</h2>
  </header>

  @if (insufficientData()) {
    <p class="insufficient-data">Se necesitan al menos 3 trades para esta visualización.</p>
  } @else {
    <div class="viz-row">
      <!-- MOUNT: BubbleDurationRComponent (RFC-016 Task 6). Inputs ready: `bubbles()`. -->
      <div class="viz-mount" data-viz="bubble-duration-r" aria-hidden="true"></div>
      <!-- MOUNT: HeatmapTradeCalendarComponent (RFC-016 Task 6). Inputs ready: `cells()`. -->
      <div class="viz-mount" data-viz="heatmap-trade-calendar" aria-hidden="true"></div>
    </div>
  }

  <dl class="facts-row" aria-label="Hechos físicos de navegación">
    <div class="fact">
      <dt>Saltos de replay</dt>
      <dd>{{ facts().replayJumps }}</dd>
    </div>
    <div class="fact">
      <dt>Pausas</dt>
      <dd>{{ facts().pauses }}</dd>
    </div>
  </dl>
</section>
